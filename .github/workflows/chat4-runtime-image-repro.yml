name: chat4-runtime-image-repro

on:
  push:
    branches:
      - chat4/execute-frozen-benchmark-20260906
    paths:
      - benchmark_execution/test_runtime_image_identity.py
      - benchmark_execution/test_harness_bridge_defects.py
      - benchmark_execution/fixtures/harbor_v0_18_terminal_bench_atrx.json
      - benchmark_execution/frozen_harbor_agent.py
      - benchmark_execution/frozen_runner.py
      - benchmark_execution/postprocess.py
      - .github/workflows/chat4-runtime-image-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOKENROUTER_BASE_URL: ""
      TOKENROUTER_API_KEY: ""
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Terminal-Bench
        uses: actions/checkout@v4
        with:
          repository: harbor-framework/terminal-bench
          ref: 2b0442c3c583b710ca8da14c8e601b99f2f1f244
          fetch-depth: 0
          path: terminal-bench
      - name: Run provider-free runtime image identity unit regression
        run: |
          set -euo pipefail
          python -m pip install --quiet 'harbor==0.18.0'
          python -m unittest -v benchmark_execution.test_runtime_image_identity
          echo UNIT_RUNTIME_IMAGE_PROVIDER_CALLS=0
      - name: Prepare exact frozen install-only harness
        uses: ./.github/actions/chat4-prepare-benchmark
      - name: Install exact frozen mini-SWE dependencies for provider-free bridge tests
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            --constraint frozen-build/provider-constraints.txt \
            'openai==2.54.0' './frozen-build/mini[full]'
          python - <<'PY'
          import importlib.metadata as md
          assert md.version('mini-swe-agent') == '2.4.6'
          assert md.version('litellm') == '1.99.0'
          assert md.version('openai') == '2.54.0'
          print('PROVIDER_FREE_FROZEN_DEPENDENCIES=PASS')
          PY
          echo DEPENDENCY_INSTALL_PROVIDER_CALLS=0
      - name: Reproduce and gate confirmation-default plus Harbor task-name defects provider-free
        env:
          PYTHONPATH: ${{ github.workspace }}/frozen-build/mini/src:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest -v benchmark_execution.test_harness_bridge_defects
          echo EFFECTIVE_CONFIRM_POLICY=PASS
          echo HARBOR_TASK_NAME_NORMALIZATION=PASS
          echo BRIDGE_REGRESSION_PROVIDER_CALLS=0
      - name: Harbor install-only runtime identity integration probe
        env:
          FROZEN_MINI_ARCHIVE: ${{ github.workspace }}/frozen-mini.tar.gz
          FROZEN_RUNNER_SCRIPT: ${{ github.workspace }}/benchmark_execution/frozen_runner.py
          FROZEN_PROVIDER_CONSTRAINTS: ${{ github.workspace }}/frozen-build/provider-constraints.txt
        run: |
          set -euo pipefail
          rm -rf validation-runtime-image-jobs
          harbor run \
            --path terminal-bench/tasks/atrx-vep-crispr \
            --agent benchmark_execution.test_runtime_image_identity:ProviderFreeRuntimeImageProbe \
            --model z-ai/glm-5.3-free \
            --jobs-dir validation-runtime-image-jobs \
            --n-attempts 1 --n-concurrent 1 --max-retries 0 \
            --no-force-build --delete --yes --install-only
          echo BENCHMARK_AGENT_RUNS=0
          echo BENCHMARK_PROVIDER_CALLS=0
          echo BENCHMARK_RESULTS_OBSERVED=0
