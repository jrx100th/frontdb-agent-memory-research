name: chat4-runtime-image-repro

on:
  push:
    branches:
      - chat4/execute-frozen-benchmark-20260906
    paths:
      - benchmark_execution/test_runtime_image_identity.py
      - benchmark_execution/frozen_harbor_agent.py
      - benchmark_execution/frozen_runner.py
      - benchmark_execution/postprocess.py
      - .github/workflows/chat4-runtime-image-repro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TOKENROUTER_BASE_URL: ""
      TOKENROUTER_API_KEY: ""
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Terminal-Bench
        uses: actions/checkout@v4
        with:
          repository: harbor-framework/terminal-bench
          ref: 2b0442c3c583b710ca8da14c8e601b99f2f1f244
          fetch-depth: 0
          path: terminal-bench
      - name: Run provider-free runtime image identity unit regression
        run: |
          set -euo pipefail
          python -m pip install --quiet 'harbor==0.18.0'
          python -m unittest -v benchmark_execution.test_runtime_image_identity
          echo UNIT_PROVIDER_CALLS=0
      - name: Prepare exact frozen install-only harness
        uses: ./.github/actions/chat4-prepare-benchmark
      - name: Validate effective confirmation defaults and Harbor task-name normalization
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/frozen-build/mini/src:$PYTHONPATH" python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from minisweagent.agents.interactive import InteractiveAgentConfig
          from minisweagent.config import get_config_from_spec
          from benchmark_execution.postprocess import _harbor_task_name_matches, find_trial_result

          cfg = get_config_from_spec('mini')
          effective = InteractiveAgentConfig(**cfg['agent'])
          assert effective.mode == 'confirm'
          assert effective.confirm_exit is True

          assert _harbor_task_name_matches('atrx-vep-crispr', 'atrx-vep-crispr')
          assert _harbor_task_name_matches('terminal-bench/atrx-vep-crispr', 'atrx-vep-crispr')
          assert not _harbor_task_name_matches('some-other-task/atrx-vep-crispr', 'atrx-vep-crispr')
          assert not _harbor_task_name_matches('wrong-task', 'atrx-vep-crispr')

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              p = root / 'trial' / 'result.json'
              p.parent.mkdir(parents=True)
              p.write_text(json.dumps({
                  'task_name': 'terminal-bench/atrx-vep-crispr',
                  'trial_name': 'trial-1'
              }), encoding='utf-8')
              found_path, obj = find_trial_result(root, 'atrx-vep-crispr')
              assert found_path == p
              assert obj['trial_name'] == 'trial-1'
          print('EFFECTIVE_CONFIRM_POLICY=PASS')
          print('HARBOR_TASK_NAME_NORMALIZATION=PASS')
          print('PROVIDER_CALLS=0')
          PY
      - name: Harbor install-only runtime identity integration probe
        env:
          FROZEN_MINI_ARCHIVE: ${{ github.workspace }}/frozen-mini.tar.gz
          FROZEN_RUNNER_SCRIPT: ${{ github.workspace }}/benchmark_execution/frozen_runner.py
          FROZEN_PROVIDER_CONSTRAINTS: ${{ github.workspace }}/frozen-build/provider-constraints.txt
        run: |
          set -euo pipefail
          rm -rf validation-runtime-image-jobs
          harbor run \
            --path terminal-bench/tasks/atrx-vep-crispr \
            --agent benchmark_execution.test_runtime_image_identity:ProviderFreeRuntimeImageProbe \
            --model z-ai/glm-5.3-free \
            --jobs-dir validation-runtime-image-jobs \
            --n-attempts 1 --n-concurrent 1 --max-retries 0 \
            --no-force-build --delete --yes --install-only
          echo BENCHMARK_AGENT_RUNS=0
          echo BENCHMARK_PROVIDER_CALLS=0
          echo BENCHMARK_RESULTS_OBSERVED=0
