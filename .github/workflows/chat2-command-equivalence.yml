name: chat2-command-equivalence

on:
  push:
    branches:
      - chat2/command-equivalence-fix-20260905

permissions:
  contents: read

jobs:
  c03-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: C03 command-equivalence regression
        env:
          PYTHONPATH: implementation/staging/src
        run: python -m pytest -q tests/staging/test_chat3_command_equivalence.py
