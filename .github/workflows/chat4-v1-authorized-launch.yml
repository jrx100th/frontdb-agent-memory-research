name: chat4-v1-authorized-launch

on:
  push:
    branches:
      - chat4/v1-provider-execution-20260907
    paths:
      - .github/workflows/chat4-v1-authorized-launch.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: chat4-v1-authorized-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout authorized execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify accepted base and freeze inputs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e026af015c0465617fbe9ef97f6f9134d95c874b HEAD
          test "$(sha256sum manifests/experiment_manifest.v1.final.json | awk '{print $1}')" = "a414c3b24f3cb6fbb6098e51c5b380786e4b95ae5ca43977b8c4337afe227a64"
          test "$(cat reproducibility/V1_MANIFEST_SHA256.txt)" = "a414c3b24f3cb6fbb6098e51c5b380786e4b95ae5ca43977b8c4337afe227a64"
          test "$(sha256sum reproducibility/v1_task_images.json | awk '{print $1}')" = "2b2e05f1e6434e67767d6fe42b51e353a56ad5f275a320fe81f79a9fa9ca6d96"
      - name: Generate exact accepted 48-condition workflow
        run: |
          set -euo pipefail
          python benchmark_execution/v1_generate_execution_workflow.py --output .github/workflows/chat4-v1-execute-frozen-benchmark.yml
          test "$(grep -c 'Execute exactly one frozen v1 task-condition' .github/workflows/chat4-v1-execute-frozen-benchmark.yml)" -eq 48
          grep -q '^  group: chat4-v1-frozen-benchmark$' .github/workflows/chat4-v1-execute-frozen-benchmark.yml
          grep -q '^  cancel-in-progress: false$' .github/workflows/chat4-v1-execute-frozen-benchmark.yml
          ! grep -q '^  push:' .github/workflows/chat4-v1-execute-frozen-benchmark.yml
      - name: Commit generated workflow only
        run: |
          set -euo pipefail
          git config user.name chat4-benchmark-bot
          git config user.email chat4-benchmark-bot@users.noreply.github.com
          git add .github/workflows/chat4-v1-execute-frozen-benchmark.yml
          git diff --cached --quiet && { echo GENERATED_WORKFLOW_ALREADY_PRESENT=YES; exit 0; }
          git commit -m "[CHAT4] materialize accepted 48-condition v1 execution workflow"
          git push origin HEAD:chat4/v1-provider-execution-20260907
      - name: Dispatch authorized provider-backed V1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if gh workflow run chat4-v1-execute-frozen-benchmark.yml \
              --ref chat4/v1-provider-execution-20260907 \
              -f orchestrator_authorization=AUTHORIZED_V1_PROVIDER_EXECUTION; then
              echo V1_PROVIDER_WORKFLOW_DISPATCHED=YES
              exit 0
            fi
            sleep 3
          done
          echo V1_PROVIDER_WORKFLOW_DISPATCHED=NO >&2
          exit 1
