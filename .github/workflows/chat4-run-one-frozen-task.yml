name: chat4-run-one-frozen-task

on:
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      task_order:
        required: true
        type: string
      condition_order:
        required: true
        type: string
      display_ordinal:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TOKENROUTER_BASE_URL: ${{ secrets.TOKENROUTER_BASE_URL }}
      TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout execution harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Terminal-Bench
        uses: actions/checkout@v4
        with:
          repository: harbor-framework/terminal-bench
          ref: 2b0442c3c583b710ca8da14c8e601b99f2f1f244
          fetch-depth: 0
          path: terminal-bench
      - name: Prepare frozen benchmark job
        uses: ./.github/actions/chat4-prepare-benchmark
      - name: Execute frozen task-condition sequence
        run: ./benchmark_execution/run_task.sh "${{ inputs.task_id }}" "${{ inputs.task_order }}" "${{ inputs.condition_order }}"
      - name: Preserve raw task evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: chat4-raw-task-${{ inputs.display_ordinal }}-${{ inputs.task_id }}
          path: |
            checkpoints/${{ inputs.task_order }}-${{ inputs.task_id }}
            runtime-image-${{ inputs.task_order }}-${{ inputs.task_id }}.txt
            frozen-mini.tar.gz.sha256
            execution-harness-sha.txt
          if-no-files-found: warn
          retention-days: 90
