name: chat2-second-rereview

on:
  push:
    branches:
      - chat2/second-rereview-fix-20260905

permissions:
  contents: read

jobs:
  prefix-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Second rereview seven regressions
        env:
          PYTHONPATH: implementation/staging/src
        run: python -m pytest -q tests/staging/test_chat3_second_rereview.py
