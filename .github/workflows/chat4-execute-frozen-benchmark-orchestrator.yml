name: chat4-execute-frozen-benchmark-orchestrator

on:
  push:
    branches:
      - chat4/execute-frozen-benchmark-20260906
    paths:
      - .github/workflows/chat4-execute-frozen-benchmark-orchestrator.yml

permissions:
  contents: read

concurrency:
  group: chat4-frozen-benchmark-v0-orchestrator-launch
  cancel-in-progress: true

jobs:
  cancellation-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel non-frozen orchestrator launch
        run: |
          echo CANCELLATION_GUARD_ONLY_NO_BENCHMARK
          exit 1
