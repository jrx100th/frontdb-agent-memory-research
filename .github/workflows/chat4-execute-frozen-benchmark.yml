name: chat4-execute-frozen-benchmark

on:
  push:
    branches:
      - chat4/execute-frozen-benchmark-20260906
    paths:
      - .github/workflows/chat4-execute-frozen-benchmark.yml

permissions:
  contents: read

concurrency:
  group: chat4-frozen-benchmark-v0-pre-integration-1
  cancel-in-progress: false

env:
  TOKENROUTER_BASE_URL: ${{ secrets.TOKENROUTER_BASE_URL }}
  TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  task01:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout execution harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Terminal-Bench
        uses: actions/checkout@v4
        with:
          repository: harbor-framework/terminal-bench
          ref: 2b0442c3c583b710ca8da14c8e601b99f2f1f244
          fetch-depth: 0
          path: terminal-bench
      - name: Prepare frozen benchmark job
        uses: ./.github/actions/chat4-prepare-benchmark
      - name: Execute task 01 atrx-vep-crispr in frozen order ABCD
        run: ./benchmark_execution/run_task.sh atrx-vep-crispr 1 ABCD
      - name: Preserve task 01 raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: chat4-raw-task-01-atrx-vep-crispr
          path: |
            checkpoints/1-atrx-vep-crispr
            runtime-image-1-atrx-vep-crispr.txt
            frozen-mini.tar.gz.sha256
            execution-harness-sha.txt
          if-no-files-found: warn
          retention-days: 90

