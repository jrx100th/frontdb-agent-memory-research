name: chat3-clearance-review

on:
  push:
    branches:
      - chat3/clearance-review-20260905

permissions:
  contents: read

jobs:
  clearance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Chat3 independent clearance variants
        env:
          PYTHONPATH: implementation/staging/src
        run: python -m pytest -q tests/review/test_chat3_clearance_adversarial.py
      - name: Re-run canonical repaired matrix
        env:
          PYTHONPATH: implementation/staging/src
        run: |
          python -m pytest -q tests/staging/test_v0_memory.py
          python -m pytest -q tests/staging/test_chat3_adversarial.py
          python -m pytest -q tests/staging/test_chat2_adversarial_variants.py
          python -m pytest -q tests/staging/test_chat3_second_rereview.py
          python -m pytest -q tests/staging/test_chat2_second_cycle_variants.py
      - name: Compile reviewer evidence
        run: python -m compileall -q tests/review
